<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyApps">
<link rel="apple-touch-icon" href="icon.png">
<title>MyApps</title>
<style>
  :root{
    --bg-top:#07211f;
    --bg-bot:#031312;
    --card:#0d3330;
    --card-edge:#164b46;
    --copper:#c98b5b;
    --copper-dim:#8a5f3d;
    --ink:#eaf6f4;
    --ink-dim:#9fc4bf;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  /* move background to html to avoid white bounce areas on iOS */
  html, body {
    margin:0;
    background:radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bot) 70%);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* ---------- Domovská obrazovka ---------- */
  #home{
    padding:env(safe-area-inset-top,28px) 20px calc(env(safe-area-inset-bottom,20px) + 12px);
    min-height:100vh;
    overflow-y:auto;
    background:transparent; /* let the html background show through */
    -webkit-overflow-scrolling: touch;
  }
  .brand{
    text-align:center;
    margin:40px 0 26px; /* increased top spacing so the title sits lower on the screen */
  }
  .brand .mark{
    font-size:28px; /* larger */
    letter-spacing:2px;
    text-transform:none; /* show the text as written (MyApps) instead of uppercase */
    color:var(--copper);
    font-weight:700;
  }
  .brand h1{
    margin:2px 0 0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.5px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    max-width:420px;
    margin:0 auto;
  }
  .tile{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:20px;
    padding:20px 14px;
    text-align:center;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    cursor:pointer;
  }
  .tile .emoji{
    font-size:32px;
    display:block;
    margin-bottom:10px;
  }
  .tile .name{
    font-size:15px;
    font-weight:700;
  }
  .tile:active{
    transform:scale(0.96);
  }

  /* ---------- Obrazovka appky (iframe) ---------- */
  #appScreen{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    /* use the same background as the homescreen so transparent iframe content blends in */
    background:radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bot) 70%);
    z-index:20;
  }
  #appScreen.show{ display:flex; }

  .app-topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(env(safe-area-inset-top,20px) + 6px) 14px 10px;
    background:var(--bg-top);
    border-bottom:1px solid var(--card-edge);
    flex-shrink:0;
  }
  .back-btn{
    background:var(--card);
    border:1px solid var(--card-edge);
    color:var(--ink);
    font-size:15px;
    font-weight:700;
    padding:8px 14px;
    border-radius:12px;
    cursor:pointer;
  }
  .back-btn:active{ opacity:0.6; }
  .app-title{
    font-size:15px;
    font-weight:700;
    color:var(--ink-dim);
  }

  #appFrame{
    flex:1;
    border:none;
    width:100%;
    overflow:auto;
    background:transparent; /* allow the parent background to show through */
  }
</style>
</head>
<body>

  <div id="home">
    <div class="brand">
      <div class="mark">MyApps</div>
    </div>
    <div class="grid" id="tileGrid"></div>
  </div>

  <div id="appScreen">
    <div class="app-topbar">
      <button type="button" class="back-btn" id="backBtn" aria-label="Späť na MyApps">&larr; Späť</button>
      <div class="app-title" id="appTitle"></div>
    </div>
    <iframe id="appFrame" title="Appka"></iframe>
  </div>

<script>
  // Zoznam appiek — pridávaj sem ďalšie: { name, emoji, path }
  const APPS = [
    { name: 'Kettle', emoji: '💧', path: 'Kettle/index.html' },
    { name: 'Hodinový log', emoji: '📝', path: 'hourly-log/index.html' },
  ];

  const tileGrid = document.getElementById('tileGrid');
  const appScreen = document.getElementById('appScreen');
  const appFrame = document.getElementById('appFrame');
  const appTitle = document.getElementById('appTitle');
  const backBtn = document.getElementById('backBtn');

  APPS.forEach(app => {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.setAttribute('aria-label', app.name);
    tile.innerHTML = `<span class="emoji" aria-hidden="true">${app.emoji}</span><span class="name">${app.name}</span>`;
    tile.addEventListener('click', () => openApp(app));
    tileGrid.appendChild(tile);
  });

  function normalizeHash(hash){
    // remove leading slashes
    return hash.replace(/^\/+/, '');
  }

  function findAppByPath(path){
    if(!path) return null;
    const normalized = normalizeHash(path);
    return APPS.find(a => a.path === normalized || a.path === './' + normalized || a.path === '/' + normalized) || null;
  }

  function openApp(app, pushHistory = true){
    appTitle.textContent = app.name;
    // Resolve relative path against current location so it works when served from a path
    // Keep iframe background transparent so the parent gradient is visible.
    appFrame.src = app.path;
    appScreen.classList.add('show');

    if(pushHistory){
      // Push a state so the back button closes the app
      history.pushState({ app: app.path }, '', '#' + encodeURIComponent(app.path));
    } else {
      // Replace state so we don't add a duplicate entry on load
      history.replaceState({ app: app.path }, '', '#' + encodeURIComponent(app.path));
    }

    // focus iframe for keyboard users
    setTimeout(() => {
      try{ appFrame.focus(); } catch(e){}
    }, 300);
  }

  function closeApp(replace = true){
    appScreen.classList.remove('show');
    appFrame.src = 'about:blank';
    appTitle.textContent = '';
    if(replace){
      // remove the hash without creating a new history entry
      history.replaceState({}, '', location.pathname + location.search);
    } else {
      history.pushState({}, '', location.pathname + location.search);
    }
  }

  backBtn.addEventListener('click', () => {
    // Close the app immediately (prevents needing to press twice for some iframes)
    closeApp(true);
  });

  window.addEventListener('popstate', (e) => {
    // When the history changes, decide based on the current hash
    const hash = decodeURIComponent(location.hash.slice(1) || '');
    if(hash){
      const app = findAppByPath(hash);
      if(app){
        openApp(app, false);
        return;
      }
    }
    // No valid hash -> close app
    closeApp(true);
  });

  // On initial load, open an app if there's a hash
  window.addEventListener('load', () => {
    const hash = decodeURIComponent(location.hash.slice(1) || '');
    if(hash){
      const app = findAppByPath(hash);
      if(app){
        openApp(app, false);
      } else {
        // If hash does not match a known app, remove it
        history.replaceState({}, '', location.pathname + location.search);
      }
    }
  });

  // keyboard: Escape closes the app when open
  window.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && appScreen.classList.contains('show')){
      // remove hash and replace state
      closeApp(true);
    }
  });
</script>
</body>
</html>
