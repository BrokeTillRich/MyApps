<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyApps">
<link rel="apple-touch-icon" href="icon.png">
<title>MyApps</title>
<style>
  :root{
    --bg-top:#07211f;
    --bg-bot:#031312;
    --card:#0d3330;
    --card-edge:#164b46;
    --copper:#c98b5b;
    --copper-dim:#8a5f3d;
    --ink:#eaf6f4;
    --ink-dim:#9fc4bf;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bot) 70%);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow:hidden;
  }

  /* ---------- Domovská obrazovka ---------- */
  #home{
    padding:env(safe-area-inset-top,28px) 20px calc(env(safe-area-inset-bottom,20px) + 12px);
    min-height:100vh;
  }
  .brand{
    text-align:center;
    margin-bottom:26px;
  }
  .brand .mark{
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--copper);
    font-weight:600;
  }
  .brand h1{
    margin:2px 0 0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.5px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    max-width:420px;
    margin:0 auto;
  }
  .tile{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:20px;
    padding:20px 14px;
    text-align:center;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .tile .emoji{
    font-size:32px;
    display:block;
    margin-bottom:10px;
  }
  .tile .name{
    font-size:15px;
    font-weight:700;
  }
  .tile:active{
    transform:scale(0.96);
  }

  /* ---------- Obrazovka appky (iframe) ---------- */
  #appScreen{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    background:var(--bg-bot);
    z-index:20;
  }
  #appScreen.show{ display:flex; }

  .app-topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(env(safe-area-inset-top,20px) + 6px) 14px 10px;
    background:var(--bg-top);
    border-bottom:1px solid var(--card-edge);
  }
  .back-btn{
    background:var(--card);
    border:1px solid var(--card-edge);
    color:var(--ink);
    font-size:15px;
    font-weight:700;
    padding:8px 14px;
    border-radius:12px;
  }
  .back-btn:active{ opacity:0.6; }
  .app-title{
    font-size:15px;
    font-weight:700;
    color:var(--ink-dim);
  }

  #appFrame{
    flex:1;
    border:none;
    width:100%;
  }
</style>
</head>
<body>

  <div id="home">
    <div class="brand">
      <div class="mark">MyApps</div>
      <h1>Moje appky</h1>
    </div>
    <div class="grid" id="tileGrid"></div>
  </div>

  <div id="appScreen">
    <div class="app-topbar">
      <button type="button" class="back-btn" id="backBtn" aria-label="Späť na MyApps">&larr; Späť</button>
      <div class="app-title" id="appTitle"></div>
    </div>
    <iframe id="appFrame" title="Appka"></iframe>
  </div>

<script>
  // Zoznam appiek — pridávaj sem ďalšie: { name, emoji, path }
  const APPS = [
    { name: 'Kettle', emoji: '💧', path: 'kettle/index.html' },
    { name: 'Hodinový log', emoji: '📝', path: 'hourly-log/index.html' },
  ];

  const tileGrid = document.getElementById('tileGrid');
  const appScreen = document.getElementById('appScreen');
  const appFrame = document.getElementById('appFrame');
  const appTitle = document.getElementById('appTitle');
  const backBtn = document.getElementById('backBtn');

  APPS.forEach(app => {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.innerHTML = `<span class="emoji" aria-hidden="true">${app.emoji}</span><span class="name">${app.name}</span>`;
    tile.addEventListener('click', () => openApp(app));
    tileGrid.appendChild(tile);
  });

  function openApp(app){
    appTitle.textContent = app.name;
    appFrame.src = app.path;
    appScreen.classList.add('show');
    history.pushState({ app: app.path }, '', '#' + app.path);
  }

  function closeApp(){
    appScreen.classList.remove('show');
    appFrame.src = 'about:blank';
    if(location.hash) history.pushState({}, '', location.pathname);
  }

  backBtn.addEventListener('click', () => history.back());
  window.addEventListener('popstate', (e) => {
    if(!e.state || !e.state.app){ closeApp(); }
  });
</script>
</body>
</html>
