<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hodinový log</title>
<style>
  :root{
    --bg-top:#07211f;
    --bg-bot:#031312;
    --card:#0d3330;
    --card-edge:#164b46;
    --copper:#c98b5b;
    --copper-dim:#8a5f3d;
    --ink:#eaf6f4;
    --ink-dim:#9fc4bf;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bot) 70%);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color:var(--ink);
    padding:20px 16px calc(env(safe-area-inset-bottom,16px) + 16px);
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  header{
    text-align:center;
    margin-bottom:16px;
    position:relative;
  }
  header .mark{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--copper);
    font-weight:600;
  }
  header h1{
    margin:2px 0 0;
    font-size:22px;
    font-weight:700;
  }
  header .date{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .back-btn{
    position:absolute;
    left:0;
    top:0;
    background:var(--card);
    border:1px solid var(--card-edge);
    color:var(--ink);
    font-size:14px;
    font-weight:700;
    padding:8px 12px;
    border-radius:12px;
  }
  .back-btn:active{ opacity:0.6; }

  /* ---------- Zoznam dní ---------- */
  .today-btn{
    display:block;
    max-width:520px;
    margin:0 auto 18px;
    width:100%;
    padding:14px 0;
    border:none;
    border-radius:14px;
    background:linear-gradient(180deg, var(--copper), var(--copper-dim));
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,0.35);
    font-size:16px;
    font-weight:800;
  }
  .today-btn:active{ transform:scale(0.98); }

  .day-list{
    max-width:520px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .day-item{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-align:left;
    width:100%;
  }
  .day-item:active{ opacity:0.7; }
  .day-item .d-date{
    font-size:15px;
    font-weight:700;
  }
  .day-item .d-sub{
    font-size:12px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .day-item .chev{
    color:var(--ink-dim);
    font-size:18px;
  }

  .empty-list{
    text-align:center;
    color:var(--ink-dim);
    font-size:14px;
    margin-top:30px;
  }

  /* ---------- Obrazovka dňa ---------- */
  .range-card{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:16px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:16px;
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }
  .range-card label{
    font-size:13px;
    color:var(--ink-dim);
  }
  select{
    background:#0a2624;
    border:1px solid var(--card-edge);
    color:var(--ink);
    font-size:15px;
    padding:8px 10px;
    border-radius:10px;
  }
  .gen-btn{
    width:100%;
    margin-top:12px;
    padding:12px 0;
    border:none;
    border-radius:12px;
    background:var(--card-edge);
    color:var(--ink);
    font-size:14px;
    font-weight:700;
  }
  .gen-btn:active{ transform:scale(0.98); }

  .range-fill{
    max-width:520px;
    margin:6px auto 12px;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .range-fill textarea{
    flex:1;
    min-height:44px;
    resize:none;
    background:transparent;
    border:1px solid var(--card-edge);
    color:var(--ink);
    padding:8px 10px;
    border-radius:10px;
    font-size:14px;
  }
  .apply-btn{
    background:linear-gradient(180deg, var(--copper), var(--copper-dim));
    border:none;
    color:#fff;
    padding:10px 12px;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
  }
  .apply-btn:active{ transform:scale(0.98); }

  .collapse-toggle{
    display:block;
    max-width:520px;
    margin:8px auto 6px;
    text-align:right;
  }
  .collapse-toggle button{
    background:transparent;
    color:var(--ink-dim);
    border:1px solid transparent;
    font-size:13px;
    padding:6px 10px;
    border-radius:10px;
  }

  .rows{
    max-width:520px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .row{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:14px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .row .hour{
    flex:0 0 auto;
    font-size:13px;
    font-weight:700;
    color:var(--copper);
    min-width:56px;
  }
  .row textarea{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    line-height:1.35;
    padding:4px 0;
    min-height:22px;
  }
  .row textarea:focus{ outline:none; }
  .row textarea::placeholder{ color:var(--ink-dim); opacity:0.6; }

  .collapse-row{
    background:linear-gradient(180deg, rgba(13,51,48,0.9), rgba(22,75,70,0.9));
    border:1px solid rgba(22,75,70,0.6);
    border-radius:14px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .collapse-row .range-label{ color:var(--ink); font-weight:700; }
  .collapse-row .range-text{ color:var(--ink-dim); margin-left:10px; flex:1; text-align:right; }
  .collapse-row button{ background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,0.06); padding:6px 10px; border-radius:10px; }

  .saved-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-dim);
    min-height:16px;
    margin-top:14px;
  }

  /* confirm modal */
  .modal-backdrop{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); z-index:60; }
  .modal-backdrop.show{ display:flex; }
  .modal{ background:var(--card); border:1px solid var(--card-edge); padding:16px; border-radius:12px; max-width:420px; width:88%; color:var(--ink); }
  .modal .title{ font-weight:800; margin-bottom:8px; }
  .modal .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .modal button{ padding:8px 12px; border-radius:10px; border:none; }
  .btn-cancel{ background:transparent; color:var(--ink-dim); }
  .btn-confirm{ background:linear-gradient(180deg, var(--copper), var(--copper-dim)); color:#fff; font-weight:800; }

  .screen{ display:none; }
  .screen.show{ display:block; }
</style>
</head>
<body>

  <!-- ZOZNAM DNÍ -->
  <div class="screen show" id="listScreen">
    <header>
      <h1>Hour-log</h1>
    </header>
    <button type="button" class="today-btn" id="todayBtn">+ Zapisovať dnes</button>
    <div class="day-list" id="dayList"></div>
    <div class="empty-list" id="emptyList">Zatiaľ nemáš žiadne staré záznamy.</div>
  </div>

  <!-- OBRAZOVKA KONKRÉTNEHO DŇA -->
  <div class="screen" id="dayScreen">
    <header>
      <button type="button" class="back-btn" id="backBtn">&larr; Späť</button>
      <div class="mark">Denník</div>
      <h1 id="dayTitle">Dnes</h1>
      <div class="date" id="dayDateLabel"></div>
    </header>

    <div class="range-card">
      <label for="fromHour">Od</label>
      <select id="fromHour"></select>
      <label for="toHour">Do</label>
      <select id="toHour"></select>
    </div>
    <button type="button" class="gen-btn" id="genBtn">Prispôsobiť rozsah hodín</button>

    <!-- New: fill entire range with a single note -->
    <div class="range-fill" id="rangeFill">
      <textarea id="rangeNote" placeholder="Zadaj text, ktorý sa použije pre celý rozsah (napr. 'V škole')"></textarea>
      <button type="button" class="apply-btn" id="applyRangeBtn">Aplikovať na rozsah</button>
    </div>

    <div class="collapse-toggle"><button id="toggleCollapseBtn">Zlúčiť rovnaké hodiny</button></div>

    <div class="rows" id="rows"></div>
    <div class="saved-note" id="savedNote"></div>
  </div>

  <!-- confirm modal -->
  <div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document">
      <div class="title">Prepísať existujúce záznamy?</div>
      <div class="body">Niektoré hodiny v rozsahu už obsahujú text. Chceš ich nahradiť zadaným textom?</div>
      <div class="actions">
        <button class="btn-cancel" id="cancelOverwriteBtn">Zrušiť</button>
        <button class="btn-confirm" id="confirmOverwriteBtn">Prepísať</button>
      </div>
    </div>
  </div>

<script>
  const listScreen = document.getElementById('listScreen');
  const dayScreen = document.getElementById('dayScreen');
  const todayBtn = document.getElementById('todayBtn');
  const backBtn = document.getElementById('backBtn');
  const dayList = document.getElementById('dayList');
  const emptyList = document.getElementById('emptyList');
  const dayTitle = document.getElementById('dayTitle');
  const dayDateLabel = document.getElementById('dayDateLabel');
  const fromSel = document.getElementById('fromHour');
  const toSel = document.getElementById('toHour');
  const genBtn = document.getElementById('genBtn');
  const rowsEl = document.getElementById('rows');
  const savedNote = document.getElementById('savedNote');
  const rangeNote = document.getElementById('rangeNote');
  const applyRangeBtn = document.getElementById('applyRangeBtn');
  const toggleCollapseBtn = document.getElementById('toggleCollapseBtn');
  const confirmModal = document.getElementById('confirmModal');
  const confirmOverwriteBtn = document.getElementById('confirmOverwriteBtn');
  const cancelOverwriteBtn = document.getElementById('cancelOverwriteBtn');

  const DAYS_INDEX_KEY = 'hourly-log:days';
  const RANGE_KEY = 'hourly-log:range';
  let activeDate = null;
  let collapseEnabled = true; // collapse identical consecutive hours by default
  let pendingApplyValue = null; // used when waiting for confirmation

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('sk-SK', { weekday:'long', day:'numeric', month:'long' });
  }

  const store = {
    async set(key, value){
      if(window.storage && window.storage.set){
        try{ await window.storage.set(key, value, false); return; }catch(e){}
      }
      try{ localStorage.setItem(key, value); }catch(e){}
    },
    async get(key){
      if(window.storage && window.storage.get){
        try{
          const res = await window.storage.get(key, false);
          if(res && res.value !== undefined && res.value !== null) return res.value;
        }catch(e){}
      }
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    }
  };

  async function getDaysIndex(){
    const raw = await store.get(DAYS_INDEX_KEY);
    if(!raw) return [];
    try{ const arr = JSON.parse(raw); return Array.isArray(arr) ? arr : []; }catch(e){ return []; }
  }
  async function addToDaysIndex(dateStr){
    const days = await getDaysIndex();
    if(!days.includes(dateStr)){
      days.push(dateStr);
      await store.set(DAYS_INDEX_KEY, JSON.stringify(days));
    }
  }

  // ---------- Zoznam dní ----------
  async function renderList(){
    const days = await getDaysIndex();
    const today = todayKey();
    const pastDays = days.filter(d => d !== today).sort((a,b) => b.localeCompare(a));
    dayList.innerHTML = '';
    emptyList.style.display = pastDays.length ? 'none' : 'block';

    for(const d of pastDays){
      const raw = await store.get('hourly-log:' + d);
      let filledCount = 0;
      if(raw){
        try{
          const data = JSON.parse(raw);
          filledCount = Object.keys(data.entries || {}).length;
        }catch(e){}
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-item';
      btn.innerHTML = `
        <span>
          <span class="d-date">${formatDate(d)}</span>
          <span class="d-sub">${filledCount} vyplnených hodín</span>
        </span>
        <span class="chev">›</span>
      `;
      btn.addEventListener('click', () => openDay(d));
      dayList.appendChild(btn);
    }
  }

  todayBtn.addEventListener('click', () => openDay(todayKey()));
  backBtn.addEventListener('click', async () => {
    dayScreen.classList.remove('show');
    listScreen.classList.add('show');
    await renderList();
  });

  // ---------- Obrazovka dňa ----------
  for(let h = 0; h < 24; h++){
    const label = String(h).padStart(2,'0') + ':00';
    const o1 = document.createElement('option'); o1.value = h; o1.textContent = label;
    const o2 = document.createElement('option'); o2.value = h; o2.textContent = label;
    fromSel.appendChild(o1);
    toSel.appendChild(o2);
  }

  function autoGrow(ta){
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  function createHourRow(h, val){
    const row = document.createElement('div');
    row.className = 'row';
    const label = String(h).padStart(2,'0') + ':00';
    row.innerHTML = `
      <div class="hour">${label}</div>
      <textarea data-hour="${h}" rows="1" placeholder="Čo si robil?"></textarea>
    `;
    const ta = row.querySelector('textarea');
    if(val) ta.value = val;
    autoGrow(ta);
    ta.addEventListener('input', () => { autoGrow(ta); scheduleSave(); });
    return row;
  }

  function buildRows(from, to, entries){
    rowsEl.innerHTML = '';
    if(from > to){ [from, to] = [to, from]; }
    // collect values for the range
    const vals = [];
    for(let h = from; h <= to; h++){
      const v = entries && entries[h] !== undefined ? entries[h] : '';
      vals.push({ hour: h, val: v });
    }

    if(collapseEnabled){
      // group consecutive equal non-empty values
      let i = 0;
      while(i < vals.length){
        const start = i;
        const currentVal = vals[i].val || '';
        i++;
        while(i < vals.length && vals[i].val === currentVal){ i++; }
        const end = i - 1;
        const span = end - start + 1;
        if(currentVal.trim() !== '' && span > 1){
          // collapsed group
          const groupEl = document.createElement('div');
          groupEl.className = 'collapse-row';
          const fromLabel = String(vals[start].hour).padStart(2,'0');
          const toLabel = String(vals[end].hour).padStart(2,'0');
          groupEl.innerHTML = `
            <div style="display:flex;gap:8px;align-items:center;">
              <div class="range-label">${fromLabel}:00–${toLabel}:00</div>
              <div class="range-text">${currentVal}</div>
            </div>
            <div style="display:flex;gap:8px;">
              <button type="button" class="expand-btn">Rozbaliť</button>
            </div>
          `;
          const expandBtn = groupEl.querySelector('.expand-btn');
          expandBtn.addEventListener('click', () => {
            // replace collapsed group with individual hour rows
            const fragment = document.createDocumentFragment();
            for(let hh = vals[start].hour; hh <= vals[end].hour; hh++){
              fragment.appendChild(createHourRow(hh, currentVal));
            }
            rowsEl.replaceChild(fragment, groupEl);
          });
          rowsEl.appendChild(groupEl);
        } else {
          // show individual rows
          for(let hh = vals[start].hour; hh <= vals[end].hour; hh++){
            const val = entries && entries[hh] !== undefined ? entries[hh] : '';
            rowsEl.appendChild(createHourRow(hh, val));
          }
        }
      }
    } else {
      // no collapsing — show all hours
      for(const it of vals){
        rowsEl.appendChild(createHourRow(it.hour, it.val));
      }
    }

    // If all values in the range are identical and non-empty, prefill the rangeNote
    const unique = Array.from(new Set(vals.map(v => v.val || '')));
    if(unique.length === 1 && unique[0].trim() !== ''){
      rangeNote.value = unique[0];
    } else {
      rangeNote.value = '';
    }
  }

  let saveTimer = null;
  function scheduleSave(){
    savedNote.textContent = 'ukladám…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 400);
  }
  async function saveNow(){
    const entries = {};
    rowsEl.querySelectorAll('textarea').forEach(t => {
      if(t.value.trim()) entries[t.dataset.hour] = t.value;
    });
    const from = Number(fromSel.value);
    const to = Number(toSel.value);
    await store.set('hourly-log:' + activeDate, JSON.stringify({ from, to, entries }));
    await store.set(RANGE_KEY, JSON.stringify({ from, to }));
    if(Object.keys(entries).length) await addToDaysIndex(activeDate);
    savedNote.textContent = 'uložené ' + new Date().toLocaleTimeString('sk-SK', { hour:'2-digit', minute:'2-digit' });
  }

  function showConfirmModal(){
    confirmModal.classList.add('show');
    confirmModal.setAttribute('aria-hidden', 'false');
  }
  function hideConfirmModal(){
    confirmModal.classList.remove('show');
    confirmModal.setAttribute('aria-hidden', 'true');
  }

  // Apply the text in rangeNote to all hour rows in the current visible range
  applyRangeBtn.addEventListener('click', () => {
    const v = rangeNote.value || '';
    // check for existing non-empty values that would be overwritten
    const existing = [];
    rowsEl.querySelectorAll('textarea').forEach(t => {
      const cur = (t.value || '').trim();
      if(cur !== '' && cur !== v.trim()) existing.push({ hour: t.dataset.hour, value: cur });
    });
    if(existing.length > 0){
      // ask for confirmation
      pendingApplyValue = v;
      showConfirmModal();
      return;
    }
    // no conflicts — apply immediately
    rowsEl.querySelectorAll('textarea').forEach(t => {
      t.value = v;
      autoGrow(t);
    });
    scheduleSave();
  });

  // modal buttons
  confirmOverwriteBtn.addEventListener('click', () => {
    if(pendingApplyValue === null) return hideConfirmModal();
    const v = pendingApplyValue;
    rowsEl.querySelectorAll('textarea').forEach(t => {
      t.value = v;
      autoGrow(t);
    });
    pendingApplyValue = null;
    hideConfirmModal();
    scheduleSave();
  });
  cancelOverwriteBtn.addEventListener('click', () => { pendingApplyValue = null; hideConfirmModal(); });

  // toggle collapse behaviour
  toggleCollapseBtn.addEventListener('click', () => {
    collapseEnabled = !collapseEnabled;
    toggleCollapseBtn.textContent = collapseEnabled ? 'Zlúčiť rovnaké hodiny' : 'Zobraziť všetky hodiny';
    // rebuild current range
    buildRows(Number(fromSel.value), Number(toSel.value), getCurrentEntriesObject());
  });

  function getCurrentEntriesObject(){
    // read entries from displayed rows (if expanded) or fall back to stored data
    const entries = {};
    rowsEl.querySelectorAll('textarea').forEach(t => {
      if(t.value.trim()) entries[t.dataset.hour] = t.value;
    });
    return entries;
  }

  async function openDay(dateStr){
    activeDate = dateStr;
    const isToday = dateStr === todayKey();
    dayTitle.textContent = isToday ? 'Dnes' : 'Záznam';
    dayDateLabel.textContent = formatDate(dateStr);

    const raw = await store.get('hourly-log:' + dateStr);
    let from = 8, to = 22, entries = {};
    if(raw){
      try{
        const data = JSON.parse(raw);
        if(Number.isInteger(data.from)) from = data.from;
        if(Number.isInteger(data.to)) to = data.to;
        entries = data.entries || {};
      }catch(e){}
    } else {
      const rawRange = await store.get(RANGE_KEY);
      if(rawRange){
        try{
          const r = JSON.parse(rawRange);
          if(Number.isInteger(r.from)) from = r.from;
          if(Number.isInteger(r.to)) to = r.to;
        }catch(e){}
      }
    }
    fromSel.value = from;
    toSel.value = to;
    buildRows(from, to, entries);
    savedNote.textContent = '';

    listScreen.classList.remove('show');
    dayScreen.classList.add('show');
  }

  genBtn.addEventListener('click', () => {
    const entries = getCurrentEntriesObject();
    buildRows(Number(fromSel.value), Number(toSel.value), entries);
    scheduleSave();
  });

  renderList();
</script>
</body>
</html>
