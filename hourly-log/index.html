<!DOCTYPE html>
<html lang="eng">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hourly-log</title>
<style>
  :root{
    --bg-top:#07211f;
    --bg-bot:#031312;
    --card:#0d3330;
    --card-edge:#164b46;
    --copper:#c98b5b;
    --copper-dim:#8a5f3d;
    --ink:#eaf6f4;
    --ink-dim:#9fc4bf;
    --select:#0f4b45;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bot) 70%);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color:var(--ink);
    padding:20px 16px calc(env(safe-area-inset-bottom,16px) + 16px);
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  header{
    text-align:center;
    margin-bottom:16px;
    position:relative;
  }
  header h1{ margin:2px 0 0; font-size:22px; font-weight:700; }
  header .date{ font-size:13px; color:var(--ink-dim); margin-top:2px; }

  .back-btn{ position:absolute; left:0; top:0; background:var(--card); border:1px solid var(--card-edge); color:var(--ink); font-size:14px; font-weight:700; padding:8px 12px; border-radius:12px; cursor:pointer; }
  .back-btn:active{ opacity:0.6; }

  .today-btn{ display:block; max-width:520px; margin:0 auto 18px; width:100%; padding:14px 0; border:none; border-radius:14px; background:linear-gradient(180deg, var(--copper), var(--copper-dim)); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  .today-btn:hover{ opacity:0.9; }
  .today-btn:active{ transform:scale(0.98); }

  .day-list{ max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .day-item{ background:var(--card); border:1px solid var(--card-edge); border-radius:14px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; text-align:left; width:100%; cursor:pointer; }
  .day-item:active{ opacity:0.8; }
  .day-item .d-date{ font-size:15px; font-weight:700; }
  .day-item .d-sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }

  .empty-list{ text-align:center; color:var(--ink-dim); font-size:14px; margin-top:30px; }

  .select-toolbar{ max-width:720px; margin:0 auto 12px; display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .select-toolbar input{ flex:1; background:transparent; border:1px solid var(--card-edge); color:var(--ink); padding:10px 12px; border-radius:10px; font-size:14px; }
  .select-toolbar input::placeholder{ color:var(--ink-dim); }
  .select-toolbar button{ background:linear-gradient(180deg, var(--copper), var(--copper-dim)); border:none; color:#fff; padding:10px 12px; border-radius:10px; font-weight:800; cursor:pointer; }
  .select-toolbar button:active{ opacity:0.8; }

  .collapse-toggle{ display:block; max-width:520px; margin:8px auto 6px; text-align:right; }
  .collapse-toggle button{ background:transparent; color:var(--ink-dim); border:1px solid transparent; font-size:13px; padding:6px 10px; border-radius:10px; cursor:pointer; }

  .rows{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .row{ background:var(--card); border:1px solid var(--card-edge); border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .row.selected{ background: linear-gradient(90deg, rgba(15,75,69,0.15), rgba(15,75,69,0.08)); border-color:var(--select); }
  .row .hour{ flex:0 0 auto; font-size:13px; font-weight:700; color:var(--copper); min-width:56px; cursor:pointer; user-select:none; }
  .row textarea{ flex:1; resize:none; background:transparent; border:none; color:var(--ink); font-family:inherit; font-size:15px; line-height:1.35; padding:4px 0; min-height:22px; }
  .row textarea:focus{ outline:none; }
  .row textarea::placeholder{ color:var(--ink-dim); opacity:0.6; }

  .collapse-row{ background:linear-gradient(180deg, rgba(13,51,48,0.9), rgba(22,75,70,0.9)); border:1px solid rgba(22,75,70,0.6); border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .collapse-row .range-label{ color:var(--ink); font-weight:700; }
  .collapse-row .range-text{ color:var(--ink-dim); margin-left:10px; flex:1; text-align:right; }
  .collapse-row button{ background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,0.06); padding:6px 10px; border-radius:10px; cursor:pointer; }

  .saved-note{ text-align:center; font-size:12px; color:var(--ink-dim); min-height:16px; margin-top:14px; }

  .screen{ display:none; }
  .screen.show{ display:block; }
</style>
</head>
<body>

  <div class="screen show" id="listScreen">
    <header>
      <h1>Hourly-log</h1>
    </header>
    <button type="button" class="today-btn" id="todayBtn">Write</button>
    <div class="day-list" id="dayList"></div>
    <div class="empty-list" id="emptyList">No old logs.</div>
  </div>

  <div class="screen" id="dayScreen">
    <header>
      <button type="button" class="back-btn" id="backBtn">&larr; Back</button>
      <h1 id="dayTitle">Today</h1>
      <div class="date" id="dayDateLabel"></div>
    </header>

    <div class="select-toolbar">
      <input id="selectionInput" placeholder="Text for selected hours (For example: 'Sleep')">
      <button id="applySelectionBtn">Apply</button>
    </div>
    <div class="rows" id="rows"></div>
    <div class="saved-note" id="savedNote"></div>
  </div>

<script>
  const listScreen = document.getElementById('listScreen');
  const dayScreen = document.getElementById('dayScreen');
  const todayBtn = document.getElementById('todayBtn');
  const backBtn = document.getElementById('backBtn');
  const dayList = document.getElementById('dayList');
  const emptyList = document.getElementById('emptyList');
  const dayTitle = document.getElementById('dayTitle');
  const dayDateLabel = document.getElementById('dayDateLabel');
  const rowsEl = document.getElementById('rows');
  const savedNote = document.getElementById('savedNote');
  const selectionInput = document.getElementById('selectionInput');
  const applySelectionBtn = document.getElementById('applySelectionBtn');

  const DAYS_INDEX_KEY = 'hourly-log:days';
  let activeDate = null;
  let collapseEnabled = true;
  let lastClickedHour = null;
  let ranges = [];

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  const store = {
    async set(key, value) {
      if (window.storage && window.storage.set) {
        try {
          await window.storage.set(key, value, false);
          return;
        } catch (e) {}
      }
      try {
        localStorage.setItem(key, value);
      } catch (e) {}
    },
    async get(key) {
      if (window.storage && window.storage.get) {
        try {
          const res = await window.storage.get(key, false);
          if (res && res.value !== undefined && res.value !== null) return res.value;
        } catch (e) {}
      }
      try {
        return localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }
  };

  async function getDaysIndex() {
    const raw = await store.get(DAYS_INDEX_KEY);
    if (!raw) return [];
    try {
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  async function addToDaysIndex(dateStr) {
    const days = await getDaysIndex();
    if (!days.includes(dateStr)) {
      days.push(dateStr);
      await store.set(DAYS_INDEX_KEY, JSON.stringify(days));
    }
  }

  async function renderList() {
    const days = await getDaysIndex();
    const today = todayKey();
    const pastDays = days.filter(d => d !== today).sort((a, b) => b.localeCompare(a));
    dayList.innerHTML = '';
    emptyList.style.display = pastDays.length === 0 ? 'block' : 'none';
    for (const day of pastDays) {
      const item = document.createElement('button');
      item.className = 'day-item';
      item.type = 'button';
      item.innerHTML = `<div><div class="d-date">${formatDate(day)}</div><div class="d-sub">${day}</div></div>`;
      item.addEventListener('click', () => openDay(day));
      dayList.appendChild(item);
    }
  }

  todayBtn.addEventListener('click', () => {
    openDay(todayKey());
  });

  backBtn.addEventListener('click', async () => {
    dayScreen.classList.remove('show');
    listScreen.classList.add('show');
    await renderList();
  });

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  function createHourRow(h, val) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = String(h).padStart(2, '0') + ':00';
    row.innerHTML = `<div class="hour" data-hour="${h}">${label}</div><textarea data-hour="${h}" placeholder="What did you do?">${val || ''}</textarea>`;
    const ta = row.querySelector('textarea');
    ta.addEventListener('input', () => {
      autoGrow(ta);
      scheduleSave();
    });
    const hourEl = row.querySelector('.hour');

    hourEl.addEventListener('click', (ev) => {
      const hour = Number(hourEl.dataset.hour);
      if (ev.shiftKey && lastClickedHour !== null) {
        const a = Math.min(lastClickedHour, hour);
        const b = Math.max(lastClickedHour, hour);
        for (let hh = a; hh <= b; hh++) {
          const taEl = rowsEl.querySelector('textarea[data-hour="' + hh + '"]');
          if (taEl) taEl.parentElement.classList.add('selected');
        }
      } else {
        row.classList.toggle('selected');
        lastClickedHour = hour;
      }
    });

    return row;
  }

  function createCollapseRow(range) {
    const groupEl = document.createElement('div');
    groupEl.className = 'collapse-row';
    const fromLabel = String(range.start).padStart(2, '0');
    const toLabel = String(range.end).padStart(2, '0');
    const text = range.text || '';
    groupEl.innerHTML = `<div class="range-label">${fromLabel}:00 - ${toLabel}:00</div><div class="range-text">${text}</div><button type="button">Edit</button>`;
    const btn = groupEl.querySelector('button');
    btn.addEventListener('click', () => {
      collapseEnabled = false;
      buildRowsFromRanges();
    });
    return groupEl;
  }

  function buildRowsFromRanges() {
    rowsEl.innerHTML = '';
    let idx = 0;
    while (idx < 24) {
      const r = ranges.find(rn => rn.start === idx);
      if (r) {
        if (collapseEnabled && r.end > r.start) {
          rowsEl.appendChild(createCollapseRow(r));
          idx = r.end;
        } else {
          rowsEl.appendChild(createHourRow(idx, idx >= r.start && idx < r.end ? r.text : ''));
          idx++;
        }
      } else {
        rowsEl.appendChild(createHourRow(idx, ''));
        idx++;
      }
    }
  }

  function normalizeRanges(arr) {
    if (!Array.isArray(arr)) return [];
    const sorted = arr.slice().sort((a, b) => a.start - b.start);
    const out = [];
    for (const r of sorted) {
      if (out.length === 0) {
        out.push(Object.assign({}, r));
      } else {
        const last = out[out.length - 1];
        if (r.start <= last.end) {
          last.end = Math.max(last.end, r.end);
          if (!last.text && r.text) last.text = r.text;
        } else {
          out.push(Object.assign({}, r));
        }
      }
    }
    return out;
  }

  let saveTimer = null;

  function scheduleSave() {
    savedNote.textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 400);
  }

  async function saveNow() {
    const entries = {};
    for (let h = 0; h < 24; h++) {
      const ta = rowsEl.querySelector('textarea[data-hour="' + h + '"]');
      if (ta) entries[h] = ta.value;
    }
    await store.set('hourly-log:' + activeDate, JSON.stringify({ ranges, entries }));
    if (Object.values(entries).some(v => v)) await addToDaysIndex(activeDate);
    savedNote.textContent = 'Saved ' + new Date().toLocaleTimeString();
  }

  applySelectionBtn.addEventListener('click', () => {
    const v = (selectionInput.value || '').trim();
    if (v === '') return;
    const selected = Array.from(rowsEl.querySelectorAll('.row.selected textarea'));
    if (selected.length === 0) return;
    const hours = selected.map(ta => Number(ta.dataset.hour)).sort((a, b) => a - b);
    const start = Math.min(...hours);
    const end = Math.max(...hours) + 1;
    ranges = ranges.filter(r => r.end < start || r.start > end);
    ranges.push({ start, end, text: v });
    ranges = normalizeRanges(ranges);
    selectionInput.value = '';
    buildRowsFromRanges();
    scheduleSave();
  });

  async function openDay(dateStr) {
    activeDate = dateStr;
    const isToday = dateStr === todayKey();
    dayTitle.textContent = isToday ? 'Today' : 'Record';
    dayDateLabel.textContent = formatDate(dateStr);
    const raw = await store.get('hourly-log:' + dateStr);
    ranges = [];
    if (raw) {
      try {
        const data = JSON.parse(raw);
        if (Array.isArray(data.ranges)) ranges = data.ranges.slice();
        if (data.entries) {
          for (let k in data.entries) {
            const h = Number(k);
            if (h >= 0 && h < 24) {
              const text = data.entries[k];
              if (text && !ranges.find(r => h >= r.start && h < r.end)) {
                ranges.push({ start: h, end: h + 1, text });
              }
            }
          }
        }
      } catch (e) {}
    }
    ranges = normalizeRanges(ranges);
    buildRowsFromRanges();
    savedNote.textContent = '';
    listScreen.classList.remove('show');
    dayScreen.classList.add('show');
  }

  renderList();
</script>
</body>
</html>
