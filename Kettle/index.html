<!DOCTYPE html>
<html lang="eng">
<head>
<script>
  // Mark whether the page is embedded early so CSS can react before rendering (avoid white flash)
  try{
    if (window.self !== window.top) {
      document.documentElement.classList.add('in-iframe');
    } else {
      document.documentElement.classList.add('standalone');
    }
  }catch(e){ document.documentElement.classList.add('standalone'); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kettle">
<title>Kettle</title>
<style>
  :root{
    --bg-top:#07211f;
    --bg-bot:#031312;
    --vessel:#0d3330;
    --vessel-edge:#164b46;
    --water-a:#1c8fa6;
    --water-b:#38c1d6;
    --copper:#c98b5b;
    --copper-dim:#8a5f3d;
    --ink:#eaf6f4;
    --ink-dim:#9fc4bf;
    --danger:#e0603f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}

  /* Default: transparent so parent can show through when embedded.
     For standalone use the .standalone class will apply the gradient. */
  body{
    margin:0;
    padding:0;
    background:transparent;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    min-height:100vh;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    user-select:none;
  }

  /* Standalone view: paint the gradient on the root so bounce never shows color */
  html.standalone {
    background:radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bot) 70%) fixed;
  }

  /* When embedded, ensure transparent background */
  html.in-iframe {
    background:transparent;
  }

  /* Backscreen: always visible under content when scrolling */
  #backscreen{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bot) 70%);
    z-index:0;
    pointer-events:none;
  }
  .content{ 
    position:relative; 
    z-index:1; 
    width:100%; 
    padding:env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 24px);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .brand{
    text-align:center;
    margin-top:10px;
  }
  .brand .kettle-mark{
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--copper);
    font-weight:600;
  }
  .brand h1{
    margin:2px 0 0;
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.5px;
  }
  .brand p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-dim);
  }

  .vessel-wrap{
    position:relative;
    width:min(62vw, 260px);
    height:min(62vw, 260px);
    margin:18px 0 10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .vessel{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:var(--vessel);
    border:3px solid var(--vessel-edge);
    overflow:hidden;
    box-shadow:
      inset 0 0 30px rgba(0,0,0,0.5),
      0 20px 40px rgba(0,0,0,0.45);
  }
  .water{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:0%;
    transition:height 0.6s cubic-bezier(.22,.61,.36,1);
    background:linear-gradient(180deg, var(--water-b), var(--water-a));
    overflow:hidden;
  }
  .water svg{
    position:absolute;
    top:-18px;
    left:0;
    width:100%;
    height:20px;
    animation:wave 3.2s linear infinite;
  }
  @keyframes wave{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .vessel.full .water{
    background:linear-gradient(180deg, #e0603f, #9c3a24);
  }
  .readout{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .readout .amount{
    font-size:15px;
    font-weight:800;
    letter-spacing:-0.5px;
    text-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .readout .amount .unit{
    font-size:15px;
    font-weight:600;
    opacity:0.8;
  }
  .readout .pct{
    font-size:12px;
    color:var(--ink-dim);
    margin-top:2px;
    text-shadow:0 2px 6px rgba(0,0,0,0.4);
  }

  .filter-note{
    font-size:12px;
    color:var(--ink-dim);
    text-align:center;
    min-height:16px;
  }
  .filter-note.warn{ color:var(--danger); font-weight:700; }

  .controls{
    width:100%;
    max-width:340px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .plus-btn{
    width:100%;
    max-width:280px;
    padding:20px 0;
    border:none;
    border-radius:22px;
    background:linear-gradient(180deg, var(--copper), var(--copper-dim));
    color:#1a0f08;
    font-size:19px;
    font-weight:800;
    letter-spacing:0.3px;
    box-shadow:0 10px 24px rgba(201,139,91,0.28), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform 0.08s ease, box-shadow 0.08s ease;
  }
  .plus-btn:active{
    transform:scale(0.96);
    box-shadow:0 4px 12px rgba(201,139,91,0.25);
  }
  .plus-btn:disabled{
    opacity:0.4;
    box-shadow:none;
  }

  .reset-btn{
    background:none;
    border:1px solid var(--vessel-edge);
    color:var(--ink-dim);
    font-size:13px;
    padding:9px 18px;
    border-radius:14px;
  }
  .reset-btn:active{ opacity:0.6; }

  .toast{
    position:fixed;
    left:50%;
    bottom:-140px;
    transform:translateX(-50%);
    width:min(88vw,340px);
    background:linear-gradient(180deg,#e0603f,#a6371f);
    color:#fff;
    padding:18px 20px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 16px 40px rgba(0,0,0,0.5);
    transition:bottom 0.5s cubic-bezier(.22,.61,.36,1);
    z-index:10;
  }
  .toast.show{ bottom:26px; }
  .toast .title{
    font-size:17px;
    font-weight:800;
    letter-spacing:0.2px;
  }
  .toast .sub{
    font-size:12.5px;
    opacity:0.9;
    margin-top:3px;
  }
  .toast button{
    margin-top:12px;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.4);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:8px 18px;
    border-radius:12px;
  }
</style>
</head>
<body>

  <div id="backscreen" aria-hidden="true"></div>
  <div class="content">

    <div class="brand">
      <div class="kettle-mark">Kettle</div>
      <h1 id="litersTitle">0 L</h1>
    </div>

    <div class="vessel-wrap">
      <div class="vessel" id="vessel">
        <div class="water" id="water">
          <svg viewBox="0 0 200 20" preserveAspectRatio="none">
            <path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 V20 H0 Z" fill="#38c1d6"></path>
          </svg>
        </div>
        <div class="readout">
          <div class="amount"><span id="litersNum">0</span><span class="unit"> L</span></div>
          <div class="pct" id="pctLabel">0 %</div>
        </div>
      </div>
    </div>

    <div class="filter-note" id="filterNote"></div>

    <div class="controls">
      <button class="plus-btn" id="plusBtn">+1 L of water</button>
    </div>

    <div class="toast" id="toast">
      <div class="title">Change filter!</div>
      <div class="sub">Kettle reached 150 L. Time to change filter.</div>
      <button id="toastOk">Filter is changed.</button>
    </div>

  </div>

<script>
  const CAPACITY = 150;
  const KEY = 'kettle:liters';

  const vessel = document.getElementById('vessel');
  const water = document.getElementById('water');
  const litersNum = document.getElementById('litersNum');
  const litersTitle = document.getElementById('litersTitle');
  const pctLabel = document.getElementById('pctLabel');
  const plusBtn = document.getElementById('plusBtn');
  const toast = document.getElementById('toast');
  const toastOk = document.getElementById('toastOk');
  const filterNote = document.getElementById('filterNote');

  let liters = 0;
  let storageOk = true;

  // Storage wrapper: prefer window.storage, then localStorage, then IndexedDB
  const DB_NAME = 'kettle-store';
  const STORE_NAME = 'kv';

  function idbOpen() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('No IndexedDB'));
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'k' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error || new Error('IDB open error'));
    });
  }

  function idbSet(key, value) {
    return new Promise((resolve, reject) => {
      idbOpen().then(db => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put({ k: key, v: String(value) });
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = (e) => { db.close(); reject(e.target?.error || new Error('IDB tx error')); };
      }).catch(reject);
    });
  }

  function idbGet(key) {
    return new Promise((resolve, reject) => {
      idbOpen().then(db => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(key);
        req.onsuccess = (e) => { const r = e.target.result; db.close(); resolve(r ? r.v : null); };
        req.onerror = (e) => { db.close(); reject(e.target?.error || new Error('IDB get error')); };
      }).catch(reject);
    });
  }

  const StorageAPI = {
    async set(key, value) {
      // prefer window.storage (original approach)
      if (window.storage) {
        try { await window.storage.set(key, String(value), false); return; } catch (e) { /* fallthrough */ }
      }
      // try localStorage
      try {
        localStorage.setItem(key, String(value));
        return;
      } catch (e) { /* fallthrough */ }
      // try indexedDB
      try {
        await idbSet(key, String(value));
        return;
      } catch (e) { /* final fallback failed */ }
      throw new Error('No persistent storage available');
    },
    async get(key) {
      if (window.storage) {
        try {
          const res = await window.storage.get(key, false);
          return res && res.value !== undefined ? res.value : null;
        } catch (e) { /* fallthrough */ }
      }
      try {
        const v = localStorage.getItem(key);
        return v !== null ? v : null;
      } catch (e) { /* fallthrough */ }
      try {
        const v = await idbGet(key);
        return v !== null ? v : null;
      } catch (e) { /* final fallback */ }
      return null;
    }
  };

  // If the page is embedded we already added the 'in-iframe' class early.
  // But keep a runtime safety net for older browsers:
  if (window.self !== window.top) {
    // make sure root elements are transparent
    document.documentElement.style.background = 'transparent';
    document.body.style.background = 'transparent';
  }

  function render(){
    const pct = Math.min(100, (liters / CAPACITY) * 100);
    water.style.height = pct + '%';
    litersNum.textContent = liters;
    litersTitle.textContent = liters + ' L';
    pctLabel.textContent = Math.round(pct) + ' %';
    vessel.classList.toggle('full', liters >= CAPACITY);
    plusBtn.disabled = liters >= CAPACITY;
    plusBtn.textContent = liters >= CAPACITY ? 'Kettle is full!' : '+1 L of water';
    filterNote.textContent = liters >= CAPACITY ? 'Change filter!' : '';
    filterNote.classList.toggle('warn', liters >= CAPACITY);
  }

  async function save(){
    if(!storageOk) return;
    try{
      await StorageAPI.set(KEY, String(liters));
    }catch(e){
      // mark storage unavailable so we don't keep trying every time
      storageOk = false;
      console.warn('Persistent storage not available:', e);
    }
  }

  async function load(){
    try{
      const v = await StorageAPI.get(KEY);
      if (v !== null && v !== undefined) {
        const n = Number(v);
        if(!Number.isNaN(n)) liters = n;
      }
    }catch(e){
      // storage not available or failed — we'll work in-memory
      storageOk = false;
      console.warn('Load from persistent storage failed:', e);
    }
    render();
  }

  function showToast(){
    toast.classList.add('show');
  }
  function hideToast(){
    toast.classList.remove('show');
  }

  plusBtn.addEventListener('click', () => {
    if(liters >= CAPACITY) return;
    liters = Math.min(CAPACITY, liters + 1);
    render();
    save();
    if(liters >= CAPACITY){
      setTimeout(showToast, 350);
    }
  });

  toastOk.addEventListener('click', () => {
    liters = 0;
    hideToast();
    render();
    save();
  });

  load();
</script>
</body>
</html>
